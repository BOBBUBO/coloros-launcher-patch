syntax = "proto2";

package android.os.statsd;

option optimize_for = CODE_SIZE;
option java_package = "com.oplus.ocenter.proto";
option java_outer_classname = "AtomsProto";
option java_multiple_files = true;

message Atom {
  // Pushed atoms start at 2.
  oneof pushed {
    // chenxinkai@oppo.com 2024/04/11 Add for gaia generic fault
    GeneralFault general_fault = 101000;

    /*--- Launcher 101001-101050 ---*/

    /*--- WMS 101051-101070 ---*/
    //Youyao.Hu@ANDROID.WMS, 2024/05/08, Add for WMS black window
    WMSSurfaceNotDrawn wms_surface_not_drawn = 101051;
    WMSSurfaceInvisible wms_surface_invisible = 101052;
    WMSTransparentWindow wms_transparent_window = 101053;
    WMSNoFocusWindow wms_no_focus_window = 101054;

    /*--- ATHENA 101071-101105 ---*/
    MemoryLeakEvent memory_leak_event = 101071;

    /*--- Display Framework 101106-101146 ---*/
    OplusNoBufferCommit oplus_no_buffer_commit = 101106 ;
    OplusLayerNumExceed oplus_layer_num_exceed = 101107 ;
    OplusDetectedBlankScreen oplus_detected_blank_screen = 101108 ;
    OplusSFHang oplus_sf_hang = 101109 ;

    /*--- Camera 101147-101156 ---*/
    OplusCameraException oplus_camera_exception_msg = 101147;
    // zhengqiong@oppo.com, 2024/05/07, Add for: camera hal dark screen exception.
    OplusCamHalException oplus_camera_softimeout_msg = 101148;
    OplusCamHalException oplus_camera_frameseletimeout_msg = 101149;
    OplusCamHalException oplus_camera_reqtimeout_msg = 101150;
    OplusCamHalException oplus_camera_aedark_msg = 101151;

    /*--- TP 101157-101176 ---*/

    /*--- Theia Resolver 101177-101208 ---*/
    TheiaResolverHungtask theia_resolver_hungtask = 101178;
    TheiaResolverSoftLockup theia_resolver_soft_lockup = 101179;
    TheiaResolverHardLockup theia_resolver_hard_lockup = 101180;
    TheiaResolverLcd theia_resolver_lcd = 101181;
    TheiaResolverGpu theia_resolver_gpu = 101182;
    TheiaResolverPwkLightUpMonitor theia_resolver_pwk_light_up_monitor = 101183;
    TheiaResolverPwkShutDownMonitor theia_resolver_pwk_shut_down_monitor = 101184;
    TheiaResolverUiTimeOut theia_resolver_ui_timeout = 101185;
    TheiaResolverNoFocusWindow theia_resolver_no_focus_window = 101186;
    TheiaResolverTransparentWindow theia_resolver_transparent_window = 101187;
    TheiaResolverFrameworkBlock theia_resolver_framework_block = 101188;
    TheiaResolverLauncherAnr theia_resolver_launcher_anr = 101189;
    TheiaResolverSystemuiAnr theia_resolver_systemui_anr = 101190;
    TheiaResolverOplusSFHang theia_resolver_oplus_sf_hang = 101191;

    /*--- Lower Level Stability 101209-101225 ---*/

    /*--- Upper Level Stability 101226-101245 ---*/
    SystemServerHalfWatchdog oplus_system_server_half_watchdog = 101226;
    TheiaEventFrameworkBlock oplus_theia_event_framework_block = 101228;

    /*--- Input 101246-101285 ---*/

    /*--- Graphics 101286-101300 ---*/
    //caoyang@MULTIMEDIA.DISPLAY.GPU, 2024/5/7, add for renderthreadNoDraw
    OplusRenderthreadInfo oplus_renderthread_info = 101286;
    //caoyang@MULTIMEDIA.DISPLAY.GPU, 2024/5/7, add for gpu fence timeout
    OplusGpuFenceTimeout oplus_gpu_fence_timeout = 101287;

    /*--- P sensor 101301-101310 ---*/
    PSensorScreenEvent psensor_screen_event = 101301;

    /*--- Systemui 101311-101360 ---*/
    //yaoyanbing@oppo.com, 2024/05/21 add for SystemUI render thread block monitor
    OplusRenderThreadBlockedEvent OPLUS_RENDER_THREAD_BLOCKED = 101311;

    /*--- UI Framework 101361-101370 ---*/
    //Bard.Zhang@oppo.com, 2024/04/22 add for barrier_monitor
    OplusBarrierTimeoutFault oplus_barrier_timeout_atom_fault = 101361;
    //Bard.Zhang@oppo.com, 2024/04/22 add for transaction_monitor
    OplusTransactionTimeoutFault oplus_transaction_timeout_atom_fault = 101362;

    /*--- Phenomenon Monitor 101371-101380 ---*/

    /*--- Game 101381-101390 ---*/

    /*--- Multimedia 101391-101400 ---*/

    /*--- Display 101401-101440 ---*/

    // Add more...
    /*--- domain name + start field index-end field index ---*/
  }
}


/**
 * chenxinkai@oppo.com 2024/04/11 Add for gaia generic fault
 *
 * Logged from ：
 *   Not specifically use in a code file, maybe in anywhere
 *
 * GeneralFault represents a generic fault message,
 * including information about the fault such as its name,
 * type, trigger, reason, and any extra information.
 *
*/
message GeneralFault {
  // The DCS application id.
  optional int32 dcs_app_id = 1;
  // The DCS log tag.
  optional string dcs_log_tag = 2;
  // The DCS event id.
  optional string dcs_event_id = 3;
  // The fault timestamp, in milliseconds.
  optional int64 fault_timestamp_ms = 4;
  // The name of the fault.
  optional string fault_name = 5;
  // The type of the fault.
  optional int32 fault_type = 6;
  // Represents what triggered the fault.
  optional string fault_trigger = 7;
  // The reason of the fault.
  optional string fault_reason = 8;
  // Contains any extra information related to the fault.
  optional string extra_info = 9;
}

