/*--- ATHENA 101071-101105 ---*/

/*
 *   WangMin@ANDROID.RESCONTROL, 2023/05/11, Add for Athena memory leak event
 *
 *   Logged from:
 *         com.oplus.athena
*/
message MemoryLeakEvent {
  // The DCS application id.
  optional int32 dcs_app_id = 1;
  // The DCS log tag.
  optional string dcs_log_tag = 2;
  // The DCS event id.
  optional string dcs_event_id = 3;
  // The fault timestamp, in milliseconds.
  optional int64 fault_timestamp_ms = 4;
  // Action
  enum Action {
    ADD = 1;
    UPDATE = 2;
    REMOVE = 3;
  }
  optional Action action = 5;
  // Leak event id
  optional int64 ab_id = 6;
  // Event type
  enum EventType {
    PROCESS_LEAK = 1;
    PACKAGE_LEAK = 2;
    KERNEL_LEAK = 3;
    ATHENA_FORCEKILL_TIP = 4;
    LMKD_FORCEKILL_TIP = 5;
  }
  optional EventType event_type = 7;
  // Leak type
  enum LeakType {
    RSS_TREND = 1;
    PSS_LIMIT = 2;
    ION_LIMIT = 3;
    GPU_LIMIT = 4;
    ASHMEM_LIMIT = 5;
    DALVIK_LIMIT = 6;
    VSS32_LIMIT = 7;
    KERNEL_STACK_LIMIT = 8;
    KERNEL_SUNRECLAIM_LIMIT = 9;
    KERNEL_KMALLOC_LIMIT = 10;
    KERNEL_VMALLOC_LIMIT = 11;
    KERNEL_UNACCOUNT_LIMIT = 12;
  }
  optional LeakType leak_type = 8;
  // Leak package name
  optional string pkg_name = 9;
  // Leak process name
  optional string proc_name = 10;
  // Current memory in MB
  optional int32 mem = 11;
  // Leak threshold in MB
  optional int32 threshold = 12;
  // Contains any extra information related to the event.
  optional string extra_info = 13;
}

/*--- ATHENA 101071-101105 end ---*/

