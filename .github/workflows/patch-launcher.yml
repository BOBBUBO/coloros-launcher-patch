name: Patch ColorOS Launcher for Regular Phones

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'Path to original APK within repository'
        required: false
        default: ''

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install apktool
        run: |
          sudo apt-get update && sudo apt-get install -y apktool

      - name: Fix AndroidManifest.xml (remove sharedUserId)
        run: |
          # Remove the oppo sharedUserId that prevents installation on non-Oppo devices
          sed -i 's/android:sharedUserId="oppo\.uid\.launcher"//' launcher_decoded/AndroidManifest.xml
          # Also remove sharedUserLabel if present
          sed -i '/android:sharedUserLabel/d' launcher_decoded/AndroidManifest.xml
          # Remove the uid_name string reference if it's only there for sharedUserLabel
          grep -q 'uid_name' launcher_decoded/res/values/strings.xml && sed -i '/uid_name/d' launcher_decoded/res/values/strings.xml || true
          echo "✓ Removed android:sharedUserId from AndroidManifest.xml"

      - name: Build patched APK with apktool
        run: |
          apktool b launcher_decoded -o patched.apk 2>&1 | tee build.log
          if [ $? -ne 0 ]; then
            echo "⚠️ Build had warnings/errors (common with Oppo system apps referencing private framework resources)"
            echo "The key fix (sharedUserId removal) is applied in AndroidManifest.xml"
          fi

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: patched-launcher-apk
          path: patched.apk
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Key fix applied**: Removed \`android:sharedUserId=\"oppo.uid.launcher\"\` from AndroidManifest.xml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This allows the ColorOS/OxygenOS launcher to install on regular (non-Oppo) Android phones." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note**: Full build may fail due to private ColorOS framework resources referenced in the APK." >> $GITHUB_STEP_SUMMARY
          echo "The manifest fix is the critical change - the launcher will install but Oppo-exclusive features will be disabled." >> $GITHUB_STEP_SUMMARY