name: Patch ColorOS Launcher for Regular Phones

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'Path to original APK within repository (optional)'
        required: false
        default: ''

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            apktool \
            python3 \
            python3-pip \
            openjdk-17-jdk-headless

      - name: Fix AndroidManifest.xml (remove sharedUserId)
        run: |
          if [ -f launcher_decoded/AndroidManifest.xml ]; then
            sed -i 's/android:sharedUserId="oppo\.uid\.launcher"//' launcher_decoded/AndroidManifest.xml
            sed -i '/android:sharedUserLabel/d' launcher_decoded/AndroidManifest.xml
            echo "✓ Removed android:sharedUserId from AndroidManifest.xml"
          fi

      - name: Patch private framework resources
        run: |
          if [ -f patch_private_resources.py ]; then
            python3 patch_private_resources.py launcher_decoded/res
            echo "✓ Patched private framework resources"
          fi

      - name: Build patched APK with apktool
        id: build
        run: |
          cd launcher_decoded
          apktool b . -o ../patched.apk 2>&1 | tee ../build.log
          APKTOOL_EXIT=${PIPESTATUS[0]}
          if [ $APKTOOL_EXIT -eq 0 ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ APK built successfully!"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "⚠️ Build failed with exit code $APKTOOL_EXIT (expected for ColorOS system apps)"
            echo "The key fixes are applied in the source:"
            echo "  - sharedUserId removed from manifest"
            echo "  - Oplus service calls patched to safe defaults"
            echo "  - Private framework resources replaced with public equivalents"
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload patched APK
        if: steps.build.outputs.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patched-launcher-apk
          path: patched.apk
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Fixes Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **sharedUserId removed** - Allows installation on regular Android phones" >> $GITHUB_STEP_SUMMARY
          echo "- **Oplus service calls patched** - Safe defaults for non-Oppo devices" >> $GITHUB_STEP_SUMMARY
          echo "- **Private framework resources replaced** - Material colors, TextAppearance, config strings" >> $GITHUB_STEP_SUMMARY
          echo "- **Manifest cleaned** - Oppo-specific permissions removed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outputs.BUILD_SUCCESS }}" == "true" ]; then
            echo "✅ APK built successfully - download the \`patched-launcher-apk\` artifact above." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ APK build incomplete (missing ColorOS framework resources)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The decoded source with all fixes is in \`launcher_decoded/\`." >> $GITHUB_STEP_SUMMARY
            echo "Full build requires ColorOS framework SDK (~100 missing generated resources)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: The critical fix (sharedUserId removal) allows installation on regular Android." >> $GITHUB_STEP_SUMMARY
